<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的英文單字記事本</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { font-family: sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">📝 英文單字記事本</h1>
    
    <div class="flex gap-2 mb-6">
      <input type="text" id="wordInput" placeholder="請輸入英文單字..." class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="addWord()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition">記錄</button>
    </div>

    <div id="vocabList" class="space-y-3">
      </div>
  </div>

  <script>
    // 網頁載入時自動讀取單字
    window.onload = fetchWords;

    async function fetchWords() {
      const res = await fetch('/api/words');
      const words = await res.json();
      const listEl = document.getElementById('vocabList');
      listEl.innerHTML = '';

      words.forEach(item => {
        const card = document.createElement('div');
        card.className = "flex items-center justify-between p-4 bg-gray-100 rounded-xl shadow-xs";
        card.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="text-lg font-bold text-gray-900">${item.word}</span>
              <button onclick="speak('${item.word}')" class="text-blue-500 hover:text-blue-700 text-sm">🔊 發音</button>
            </div>
            <p class="text-gray-600 text-sm mt-1">${item.translation}</p>
          </div>
          <button onclick="deleteWord(${item.id})" class="text-red-500 hover:text-red-700 font-medium text-sm ml-4">刪除</button>
        `;
        listEl.appendChild(card);
      });
    }

    async function addWord() {
      const input = document.getElementById('wordInput');
      const word = input.value.trim();
      if (!word) return;

      const res = await fetch('/api/words', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word })
      });

      if (res.ok) {
        input.value = '';
        fetchWords();
      } else {
        const err = await res.json();
        alert(err.detail || '發生錯誤');
      }
    }

    async function deleteWord(id) {
      if (!confirm('確定要刪除這個單字嗎？')) return;
      await fetch(`/api/words/${id}`, { method: 'DELETE' });
      fetchWords();
    }

    // 瀏覽器原生發音功能
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
